name: CI

on:
  push:
    branches: ["main", "develop", "dev"]
  pull_request:
    branches: ["*"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workspace
        run: npm run lint

      - name: Test workspace
        run: npm run test

      - name: Build workspace
        run: npm run build
