version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: viet_autoescuela_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: viet_acosla
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: viet_autoescuela_gateway
    depends_on:
      - mysql
    env_file:
      - .env
    command: npm run start --workspace apps/api-gateway
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: viet_autoescuela_web
    depends_on:
      - api-gateway
    env_file:
      - .env
    command: npm run start --workspace apps/web
    ports:
      - "3000:3000"

volumes:
  mysql_data:
